<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Text to Image</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <div class="input-group">
      <input type="text" id="imageUrl" placeholder="Enter text for image">
      <button id="createBtn">Create Image</button>
    </div>
    
    <!-- Add filter bar -->
    <div id="filterBar" class="filter-bar">
      <div class="filter-user">
        <img id="filterAvatar" class="user-avatar" src="" alt="Filter user">
        <span>Showing images by</span>
        <strong id="filterUser"></strong>
        <span class="clear-filter" onclick="clearFilter()">&times;</span>
      </div>
    </div>
    
    <div id="imageContainer"></div>
  </div>

  <!-- Viewers Modal -->
  <div id="viewersModal" class="modal">
    <div class="modal-content">
      <div class="modal-header">
        <div class="modal-title">Image Viewers</div>
        <button id="closeModal" class="close-button">&times;</button>
      </div>
      <div id="viewersList" class="viewers-list"></div>
    </div>
  </div>

  <script src="script.js"></script>

</body>
</html>
